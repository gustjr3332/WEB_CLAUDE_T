<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1>복지관 갤러리 블로그</h1>
  <p class="tagline">생각을 기록하는 공간</p>
</header>

<main class="post-list" id="post-list">

  <article class="post" data-post-id="post-1" data-post-title="정적 웹페이지로 좋아요 집계 시스템 만들기">
    <h2 class="post-title">1번 포스트</h2>
    <p class="post-meta">2026-08-20 · 개발</p>
    <p class="post-body">
      천만번 더들어도 기분 좋은말

      "사랑해~~"
    </p>
    <footer class="post-footer">
      <button class="like-btn" type="button" aria-label="좋아요">
        <span class="like-icon">♥</span>
        <span class="like-count">0</span>
      </button>
    </footer>
  </article>

  <article class="post" data-post-id="post-2" data-post-title="localStorage와 쿠키, 언제 무엇을 쓸까">
    <h2 class="post-title">2번 포스트</h2>
    <p class="post-meta">2026-08-18 · 웹 기초</p>
    <p class="post-body">
      안녕하세요원이입니다잘부탁드립니다.
    </p>
    <footer class="post-footer">
      <button class="like-btn" type="button" aria-label="좋아요">
        <span class="like-icon">♥</span>
        <span class="like-count">0</span>
      </button>
    </footer>
  </article>

  <article class="post" data-post-id="post-3" data-post-title="Google Apps Script로 간단한 수집 엔드포인트 만들기">
    <h2 class="post-title">3번 포스트</h2>
    <p class="post-meta">2026-08-15 · 자동화</p>
    <p class="post-body">
      돈벌어취직해사업해걍망해대출해파산해인생끝
    </p>
    <footer class="post-footer">
      <button class="like-btn" type="button" aria-label="좋아요">
        <span class="like-icon">♥</span>
        <span class="like-count">0</span>
      </button>
    </footer>
  </article>

</main>

<footer class="site-footer">
  <p id="sync-status">동기화 대기 중…</p>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
